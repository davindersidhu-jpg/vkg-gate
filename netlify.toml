[build]
publish = "public"
command = "npm install --include=optional"

[functions]
directory = "netlify/functions"
included_files = ["views/**", "db/schema.sql"]
node_bundler = "esbuild"
external_node_modules = ["@libsql/client", "libsql", "ejs"]

[[redirects]]
from = "/*"
to = "/.netlify/functions/api/:splat"
status = 200