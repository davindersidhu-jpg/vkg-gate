[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  included_files = ["views/**", "db/schema.sql"]
  node_bundler = "esbuild"

# Anything not matched by a static file in /public falls through to the
# Express app running as a single serverless function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
